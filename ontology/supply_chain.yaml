version: 1
name: Supply chain
sim: {module: sim.world}
namespace: https://example.org/sc#
# Declarative KPIs. The remaining supply-chain KPIs (value_at_risk, extra_cost, exposure_shipments,
# exposure_suppliers) need joins/recursion and stay in engine/kpis.py.
kpis:
  delay_hours_total: {description: Total delay hours over all shipments, expr: "sum(Shipment.delay_hours)"}
  shipments_delayed: {description: Shipments currently delayed, expr: "count(Shipment, where status = 'delayed')"}
  shipments_in_transit: {description: Shipments currently in transit, expr: "count(Shipment, where status = 'in_transit')"}
  ports_closed: {description: Ports currently closed, expr: "count(Port, where status = 'closed')"}
  invoices_flagged: {description: Invoices flagged as anomalous, expr: "count(Invoice, where status = 'flagged')"}
classes:
  Facility: {}
  Port: {extends: Facility}
  Warehouse: {extends: Facility}
objectTypes:
  Supplier:  {properties: {name: "string!", country: string, price_index: float}}
  Port:      {properties: {name: "string!", lat: float, lon: float, location: point, status: {enum: [open, closed]}, region: {enum: [APAC, EMEA, AMER]}}}
  Warehouse: {properties: {name: "string!", lat: float, lon: float, location: point, region: {enum: [APAC, EMEA, AMER]}}}
  Shipment:
    properties:
      ref: "string!"
      eta: timestamp
      status: {enum: [planned, in_transit, delayed, arrived]}
      position: {type: point, volatile: true}
      progress: {type: float, volatile: true}
      cargo_value: float
      delay_hours: float
      extra_cost: float
  Carrier:   {properties: {name: "string!"}}
  Invoice:
    properties:
      ref: "string!"
      amount: "float!"
      currency: string
      status: {enum: [open, approved, paid, flagged]}
      due: timestamp
      anomaly: string
  PurchaseOrder: {properties: {ref: "string!", amount: float, status: string}}
  Event:
    properties:
      kind: "string!"
      severity: {enum: [low, medium, high]}
      started: timestamp
      ended: timestamp
      note: string
linkTypes:
  ships_via:   {from: Shipment, to: Port,     cardinality: many-to-many}
  supplies:    {from: Supplier, to: Supplier, cardinality: many-to-many, transitive: true, inverse: supplied_by}
  operated_by: {from: Shipment, to: Carrier,  cardinality: many-to-one, required: true}
  ships_from:  {from: Shipment, to: Facility, cardinality: many-to-one}
  ships_to:    {from: Shipment, to: Warehouse, cardinality: many-to-one}
  invoices_for: {from: Invoice, to: Shipment, cardinality: many-to-one}
  billed_by:   {from: Invoice,  to: Supplier, cardinality: many-to-one}
  affects:     {from: Event,    to: Port,     cardinality: many-to-many}
roles:
  planner:
    description: Supply-chain planner. Plans shipments and handles port disruptions; cannot see invoices; supplier country is masked.
    types:
      Shipment: {read: true, write: true}
      Carrier: {read: true}
      Supplier: {read: true, mask: [country]}
      Port: {read: true, write: true}
      Warehouse: {read: true}
      Event: {read: true, write: true}
      PurchaseOrder: {read: true}
      Invoice: {read: false}
    links: [ships_via, ships_from, ships_to, operated_by, supplies, affects]
    actions: [create_object, update_object, delete_object, create_link, end_link, ship_depart, ship_position, ship_arrive, delay_shipment, reroute_shipment, close_port, reopen_port]
    agent:
      allowlist: [delay_shipment, reroute_shipment, close_port]
      tools: [query_objects, traverse, find_paths, impact_analysis, get_history, as_of, diff, run_function, propose_action, scenario_open, scenario_apply, scenario_simulate, scenario_compare]
      instructions: "Focus on shipments, ports and rerouting. Use shipments_at_risk and risk_factors before proposing a delay or reroute; propose close_port only when an open Event justifies it. Invoices are not visible to you."
  finance_analyst:
    description: Finance analyst. Works with invoices and purchase orders; proposes payments for approval.
    types:
      Invoice: {read: true, write: true}
      PurchaseOrder: {read: true, write: true}
      Supplier: {read: true}
      Shipment: {read: true}
      Carrier: {read: true}
      Port: {read: true}
      Warehouse: {read: true}
      Event: {read: true}
    links: [invoices_for, billed_by, supplies, ships_via, ships_from, ships_to, operated_by, affects]
    actions: [create_object, update_object, create_link, end_link, issue_invoice, flag_invoice, pay_invoice]
    agent:
      allowlist: [flag_invoice, pay_invoice]
      tools: [query_objects, traverse, find_paths, impact_analysis, get_history, as_of, diff, run_function, propose_action, scenario_open, scenario_compare]
      instructions: "Focus on invoices and anomalies. Use invoice_anomaly_score to find suspicious invoices and propose flag_invoice with the reasons. Never pay an invoice without approval: pay_invoice is only ever proposed, and only for open, unflagged invoices."
  regional_ops_lead:
    description: Regional operations lead (EMEA). Sees and operates only ports and warehouses of their region and the shipments heading to them.
    region: EMEA
    types:
      Port: {read: true, write: true, where: "region = $region"}
      Warehouse: {read: true, where: "region = $region"}
      Shipment: {read: true, where: "exists(ships_to, Warehouse: region = $region)"}
      Carrier: {read: true}
      Supplier: {read: true, mask: [country]}
      Event: {read: true, write: true}
    links: [ships_via, ships_from, ships_to, operated_by, supplies, affects]
    actions: [close_port, reopen_port]
    agent:
      allowlist: [close_port, reopen_port]
      tools: [query_objects, traverse, find_paths, impact_analysis, get_history, as_of, diff, run_function, propose_action, scenario_open, scenario_apply, scenario_simulate, scenario_compare]
      instructions: "You serve the EMEA region only. Consider only ports, warehouses and shipments visible to you, and propose port closures or reopenings for EMEA ports."
  admin:
    description: Administrator. Full access, approves every approval-gated action.
    types: all
    links: all
    actions: all
    approves: all
    agent:
      allowlist: [flag_invoice, delay_shipment, close_port, reopen_port, reroute_shipment]
      tools: [query_objects, traverse, find_paths, impact_analysis, get_history, as_of, diff, run_function, propose_action, scenario_open, scenario_apply, scenario_simulate, scenario_compare]
      instructions: "Administrator assistant with a deliberately small proposal allowlist. Prefer read-only analysis; propose only when evidence is clear. You cannot approve your own proposals."
  sim:
    description: System role used by the simulation. Never selectable from the UI.
    types: all
    links: all
    actions: [create_object, create_link, ship_depart, ship_position, ship_arrive, delay_shipment, close_port, reopen_port, issue_invoice, flag_invoice, pay_invoice, set_supplier_price_index]
functions:
  shipments_at_risk:
    description: Non-arrived shipments that ship via a given port.
    params: {port: "uuid(Port)!"}
    roles: [planner, regional_ops_lead, finance_analyst, admin]
  invoice_anomaly_score:
    description: Deterministic anomaly score in [0,1] for an invoice (amount vs the supplier's other invoices), with reasons.
    params: {invoice: "uuid(Invoice)!"}
    roles: [finance_analyst, admin]
  risk_factors:
    description: Delay hours, closed ports on the route and open events affecting those ports for a shipment.
    params: {shipment: "uuid(Shipment)!"}
    roles: [planner, regional_ops_lead, finance_analyst, admin]
webhooks:
  notify_ops: {url_env: ISNAD_WEBHOOK_OPS_URL, method: POST, max_attempts: 5, description: Notify operations of port disruptions.}
  notify_finance: {url_env: ISNAD_WEBHOOK_FINANCE_URL, method: POST, max_attempts: 5, description: Notify finance of flagged invoices.}
actions:
  create_object:
    description: Create an object of any type (generic, used by REST).
    params: {type: "string!", id: uuid, props: string!}
    roles: [planner, finance_analyst, admin, sim]
    function: create_object
  update_object:
    description: Replace properties of an object.
    params: {type: "string!", id: "uuid!", props: string!}
    roles: [planner, finance_analyst, admin]
    function: update_object
  delete_object:
    description: End an object's validity.
    params: {type: "string!", id: "uuid!"}
    roles: [planner, admin]
    function: delete_object
  create_link:
    description: Create a link between two objects.
    params: {link: "string!", src: "uuid!", dst: "uuid!"}
    roles: [planner, finance_analyst, admin, sim]
    function: create_link
  end_link:
    description: End a link between two objects.
    params: {link: "string!", src: "uuid!", dst: "uuid!"}
    roles: [planner, finance_analyst, admin]
    function: end_link
  ship_depart:
    description: Shipment leaves origin and becomes in_transit.
    params: {shipment: "uuid!"}
    roles: [planner, admin, sim]
    bind: {sh: {type: Shipment, id: $shipment}}
    rules:
      - modify: {type: Shipment, id: $shipment, set: {status: in_transit, progress: 0.0}}
  ship_position:
    description: Update a shipment's position and progress (a delayed shipment resumes).
    params: {shipment: "uuid!", position: "point!", progress: "float!"}
    roles: [planner, admin, sim]
    function: ship_position
  ship_arrive:
    description: Shipment arrives at destination.
    params: {shipment: "uuid!"}
    roles: [planner, admin, sim]
    bind: {sh: {type: Shipment, id: $shipment}}
    rules:
      - modify: {type: Shipment, id: $shipment, set: {status: arrived, progress: 1.0}}
  delay_shipment:
    description: Mark a shipment delayed and push its ETA back.
    params: {shipment: "uuid!", delay_hours: "float!", reason: string}
    approval: {approvers: [admin]}   # who may approve proposals (agent proposals)
    roles: [planner, admin, sim]
    bind: {sh: {type: Shipment, id: $shipment}}
    criteria:
      - {expr: "$delay_hours > 0", message: "delay_hours must be positive"}
    function: delay_shipment
  close_port:
    description: Close a port, open a port_closure Event affecting it.
    params: {port: "uuid!", reason: string, duration_h: float, event_id: uuid}
    approval: {approvers: [admin]}   # who may approve proposals (agent proposals)
    roles: [planner, regional_ops_lead, admin, sim]
    bind: {port: {type: Port, id: $port}}
    function: close_port
    webhooks: [notify_ops]
  reroute_shipment:
    description: Reroute a shipment from its current port to a new open port.
    params: {shipment: "uuid(Shipment)!", new_port: "uuid(Port)!", reason: string}
    approval: {approvers: [admin]}   # who may approve proposals (agent proposals)
    roles: [planner, admin]
    bind: {sh: {type: Shipment, id: $shipment}, np: {type: Port, id: $new_port}}
    criteria:
      - {expr: "sh.status != 'arrived'", message: "Shipment has already arrived"}
      - {expr: "np.status == 'open'", message: "New port is not open"}
    function: reroute_shipment
  reopen_port:
    description: Reopen a port and end its open closure Event.
    params: {port: "uuid!"}
    approval: {approvers: [admin]}   # who may approve proposals (agent proposals)
    roles: [planner, regional_ops_lead, admin, sim]
    bind: {port: {type: Port, id: $port}}
    function: reopen_port
  set_supplier_price_index:
    description: Set a supplier's price index (used by the simulation price shock; sim and admin only).
    params: {supplier: "uuid(Supplier)!", price_index: "float!"}
    roles: [sim, admin]
    bind: {su: {type: Supplier, id: $supplier}}
    criteria:
      - {expr: "$price_index > 0", message: "Price index must be positive"}
      - {expr: "$price_index < 1000", message: "Price index must be below 1000"}
    rules:
      - modify: {type: Supplier, id: $supplier, set: {price_index: $price_index}}
  issue_invoice:
    description: Issue an invoice for a shipment, billed by a supplier.
    params: {shipment: "uuid!", supplier: "uuid!", amount: "float!", currency: string, due: timestamp, invoice_id: uuid, ref: string}
    roles: [finance_analyst, admin, sim]
    bind: {sh: {type: Shipment, id: $shipment}, su: {type: Supplier, id: $supplier}}
    criteria:
      - {expr: "$amount > 0", message: "Invoice amount must be positive"}
    function: issue_invoice
  flag_invoice:
    description: Flag an invoice as anomalous.
    params: {invoice: "uuid!", anomaly: "string!"}
    approval: {approvers: [admin]}   # who may approve proposals (agent proposals)
    roles: [finance_analyst, admin, sim]
    bind: {inv: {type: Invoice, id: $invoice}}
    criteria:
      - {expr: "inv.status != 'paid'", message: "Invoice is already paid"}
    rules:
      - modify: {type: Invoice, id: $invoice, set: {status: flagged, anomaly: $anomaly}}
    webhooks: [notify_finance]
  pay_invoice:
    description: Pay an open invoice (needs approval by an admin).
    params: {invoice: "uuid!"}
    roles: [finance_analyst, admin, sim]
    approval: {required: true, approvers: [admin], exempt: [sim]}
    bind: {inv: {type: Invoice, id: $invoice}}
    criteria:
      - {expr: "inv.status == 'open'", message: "Only open invoices can be paid"}
    rules:
      - modify: {type: Invoice, id: $invoice, set: {status: paid}}
    rollback: compensate
